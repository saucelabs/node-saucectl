# This workflow is triggered by https://github.com/saucelabs/saucectl on release.
name: Release

on: [repository_dispatch]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Event Information
        run: echo "Event '${{ github.event.action }}' received from '${{ github.event.client_payload.version }}'"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org/

      - name: Update npm to a version that supports Trusted Publishing
        # Trusted publishing needs >= 11.5.1; pinned to a major so a new npm release cannot break publishing.
        run: npm install -g npm@11

      - name: Install Dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Git Setup
        run: |
          git config --global user.name "oss-sauce-bot"
          git config --global user.email "66365630+oss-sauce-bot@users.noreply.github.com"

      # Publishes via OIDC (trusted publishing), so no NODE_AUTH_TOKEN is needed.
      - name: Release
        if: github.event.client_payload.version != ''
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          npm version "$VERSION" -m "%s"
          npm publish
          git push --follow-tags

  post-deploy-install:
    needs: ["deploy"]
    if: github.event.client_payload.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Event Information
        run: echo "Event '${{ github.event.action }}' received from '${{ github.event.client_payload.version }}'"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install saucectl
        run: npm install saucectl@${{ github.event.client_payload.version }}
