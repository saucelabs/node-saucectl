# This workflow is triggered by https://github.com/saucelabs/saucectl on release.
name: Release

on: [repository_dispatch]

jobs:
  test:
    if: github.event.client_payload.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Event Information
        env:
          ACTION: ${{ github.event.action }}
          VERSION: ${{ github.event.client_payload.version }}
        run: echo "Event '$ACTION' received from '$VERSION'"
      - name: Clone Repository
        uses: actions/checkout@v7
      - name: Setup Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org/
      - name: Update npm to a version that supports Trusted Publishing
        run: npm install -g npm@latest
      - name: Setup Git
        run: |
          git config --global user.name "oss-sauce-bot"
          git config --global user.email "66365630+oss-sauce-bot@users.noreply.github.com"
      - name: Install dependencies
        run: npm install
      - name: Release
        run: npm run release:ci -- "$VERSION"
        env:
          VERSION: ${{ github.event.client_payload.version }}
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  post-release-install:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node version
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # The registry can take a few minutes to list a newly published version.
      - name: Wait for version on npm registry
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          for i in $(seq 1 30); do
            if npm view "saucectl@$VERSION" version --prefer-online 2>/dev/null | grep -qx "$VERSION"; then
              echo "saucectl@$VERSION is available"
              exit 0
            fi
            echo "Attempt $i: saucectl@$VERSION not visible yet, retrying in 20s"
            sleep 20
          done
          echo "saucectl@$VERSION did not appear on npm within 10 minutes"
          exit 1
      - name: Install saucectl
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: npm install "saucectl@$VERSION" --prefer-online
