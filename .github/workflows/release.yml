# This workflow is triggered by https://github.com/saucelabs/saucectl on release.
name: Release

on: [repository_dispatch]

jobs:
  test:
    if: github.event.client_payload.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Event Information
        run: echo "Event '${{ github.event.action }}' received from '${{ github.event.client_payload.version }}'"
      - name: Clone Repository
        uses: actions/checkout@v7
      - name: Setup Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org/
      - name: Update npm to a version that supports Trusted Publishing
        run: npm install -g npm@latest
      - name: Setup Git
        run: |
          git config --global user.name "oss-sauce-bot"
          git config --global user.email "66365630+oss-sauce-bot@users.noreply.github.com"
      - name: Install dependencies
        run: npm install
      - name: Release
        run: npm run release:ci -- ${{ github.event.client_payload.version }}
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  post-release-install:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node version
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install saucectl
        run: npm install saucectl@${{ github.event.client_payload.version }}
